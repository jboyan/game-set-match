[project]
name = "game-set-match"
version = "0.1.0"
description = "Tennis point-to-match probability explorer (Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.41.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

# App is run as app.py with sys.path to src/; no installable package layout.
# Avoids `poetry install` failing with "No file/folder found for package".
[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
