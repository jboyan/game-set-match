[project]
name = "game-set-match"
version = "0.1.0"
description = "Tennis point-to-match probability explorer (Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.41.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
